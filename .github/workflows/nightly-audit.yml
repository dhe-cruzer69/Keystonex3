name: Nightly Fleet Audit

on:
  schedule:
    - cron: "30 20 * * *" # 02:00 IST
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/nightly-audit.yml"
      - "collectors/**"
      - "tests/**"
      - "pyproject.toml"

# Least privilege at the workflow level. The write scope lives only on the
# snapshot job, which never runs on pull requests.
permissions:
  contents: read

concurrency:
  group: fleet-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Run regression tests
        run: python -m pytest -q
      - name: Collect complete inventory (private coverage required)
        if: github.event_name != 'pull_request'
        env:
          GH_FLEET_TOKEN: ${{ secrets.X4_FLEET_TOKEN }}
          GITHUB_OWNER: dhe-cruzer69
        run: |
          python -m collectors.gh_inventory --owner dhe-cruzer69 --out data/inventory.json --min-private 1
      - name: Actions health (must succeed)
        if: github.event_name != 'pull_request'
        env:
          GH_FLEET_TOKEN: ${{ secrets.X4_FLEET_TOKEN }}
          GITHUB_OWNER: dhe-cruzer69
        run: |
          python -m collectors.gh_actions_health --inventory data/inventory.json --token "$GH_FLEET_TOKEN"
      - name: Upload snapshots
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fleet-snapshots
          path: data/
          if-no-files-found: ignore
          retention-days: 7

  snapshot:
    needs: audit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - name: Download snapshots
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fleet-snapshots
          path: data/
      - name: Commit snapshots
        run: |
          git config user.name "x4-fleet[bot]"
          git config user.email "x4-fleet[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "chore(fleet): nightly inventory + health snapshot"
            git push origin HEAD:main
          else
            echo "no snapshot changes"
          fi
