name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check collectors healing tests

      - name: Type check
        run: mypy collectors --ignore-missing-imports

      - name: Unit tests
        run: pytest -q --tb=short

      - name: Import dry-run
        run: |
          python -c "from collectors.gh_inventory import summarize, compute_staleness; print('inventory ok')"
          python -c "from collectors.gh_actions_health import main; print('health module ok')"
