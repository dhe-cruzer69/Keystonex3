name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check collectors healing tests

      - name: Type check
        run: mypy collectors --ignore-missing-imports

      - name: Unit tests
        run: pytest -q --tb=short

      - name: Import dry-run
        run: |
          python -c "from collectors.gh_inventory import summarize, compute_staleness; print('inventory ok')"
          python -c "from collectors.gh_actions_health import main; print('health module ok')"
